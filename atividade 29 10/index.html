
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta de Notas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>📚 Sistema de Notas</h1>
        <p class="descricao">Consulte a média e a situação acadêmica do estudante.</p>

        <form id="formNotas">
            <label for="nome">Nome do estudante</label>
            <input type="text" id="nome" placeholder="Digite o nome">

            <label for="nota1">Primeira nota</label>
            <input type="number" id="nota1" placeholder="Nota de 0 a 10"
                   min="0" max="10" step="any">

            <label for="nota2">Segunda nota</label>
            <input type="number" id="nota2" placeholder="Nota de 0 a 10"
                   min="0" max="10" step="any">

            <label for="nota3">Terceira nota</label>
            <input type="number" id="nota3" placeholder="Nota de 0 a 10"
                   min="0" max="10" step="any">

            <button type="submit">Calcular média</button>
            <button type="button" id="limpar" class="btn-limpar">
                Limpar consulta
            </button>
        </form>

        <section id="resultado" class="resultado" aria-live="polite"
                 aria-atomic="true"></section>

        <p class="rodape">Sistema acadêmico • Consulta de notas</p>
    </main>
</body>
</html>
